<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decathlon Canada ↔ Turkey Comparer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Decathlon Canada ↔ Turkey Comparer</h1>
      <p class="subtitle">Compare by item ID. If missing in Turkey, result shows <strong>Not selling in Turkey</strong>.</p>

      <section class="card">
        <h2>1) Upload catalogs (CSV)</h2>
        <div class="upload-grid">
          <div>
            <label for="caFile">Canada CSV</label>
            <input id="caFile" type="file" accept=".csv" />
            <button id="uploadCa">Upload Canada</button>
          </div>
          <div>
            <label for="trFile">Turkey CSV</label>
            <input id="trFile" type="file" accept=".csv" />
            <button id="uploadTr">Upload Turkey</button>
          </div>
        </div>
        <p id="catalogStatus">Catalog status loading...</p>
      </section>

      <section class="card">
        <h2>2) Compare item ids</h2>
        <label for="itemIds">Item IDs (one per line or comma-separated)</label>
        <textarea id="itemIds" rows="8" placeholder="8553203\n1234567"></textarea>
        <button id="compareBtn">Compare</button>
      </section>

      <section class="card">
        <h2>Results</h2>
        <div id="results" class="results"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
